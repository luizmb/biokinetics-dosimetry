name: BiokineticsDosimetry

options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: lu.ios

packages:
  BiokineticsDosimetryApp:
    path: .

targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
    dependencies:
      - package: BiokineticsDosimetryApp
        product: App.Core
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lu.ios.biokinetics
        MARKETING_VERSION: "0.1.4"
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Sources/App/Info.plist
        ENABLE_TESTING_SEARCH_PATHS: YES
        CODE_SIGN_IDENTITY: ""

schemes:
  App:
    build:
      targets:
        App: all
    test:
      parallelizable: false
      targets:
        - package: BiokineticsDosimetryApp/EditorFeatureTests
        - package: BiokineticsDosimetryApp/CalculatorFeatureTests
        - package: BiokineticsDosimetryApp/AppCoreTests
